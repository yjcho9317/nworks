name: Release

# git tag(vX.Y.Z) 푸시 시 npm에 provenance 서명과 함께 자동 게시한다.
# v1.2.2 태그 누락·수동 릴리스로 인한 버전 불일치의 근본 해법.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Release 생성 및 .mcpb 첨부에 필요
      id-token: write # npm provenance 서명에 필요

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG != package.json $PKG" >&2
            exit 1
          fi

      - run: npm run lint
      - run: npm test
      - run: npm run build

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 비개발자용 원클릭 설치 번들(.mcpb)을 프로덕션 의존성만으로 패킹해 릴리스에 첨부한다.
      - name: Build and attach MCPB bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm prune --omit=dev
          npx --yes @anthropic-ai/mcpb pack . "nworks-${GITHUB_REF_NAME}.mcpb"
          gh release create "$GITHUB_REF_NAME" "nworks-${GITHUB_REF_NAME}.mcpb" --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" "nworks-${GITHUB_REF_NAME}.mcpb" --clobber
