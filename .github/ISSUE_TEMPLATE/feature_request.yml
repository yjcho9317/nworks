name: Feature request
description: Suggest a capability or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case, not just the feature. What are you trying to get done?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: false
  - type: dropdown
    id: surface
    attributes:
      label: Which surface?
      options:
        - CLI
        - MCP tools
        - Both
        - Not sure
    validations:
      required: true
